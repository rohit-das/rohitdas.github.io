<style>
  #travel-map {
    height: 500px;
    width: 100%;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    z-index: 1; /* Keeps map behind dropdown menus/modals */
  }
  .map-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 10px;
    font-size: 0.9em;
    font-family: sans-serif;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-color {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid #555;
  }
</style>

<div class="map-legend" id="map-legend"></div>
<div id="travel-map"></div>

    { name: "Bali", country: "Indonesia", coords: [-8.4095, 115.1889], continent: "Asia", year: "2017" }
  ];

  // 2. COLOR MAPPING BY CONTINENT
  const continentColors = {
    "North America": "#0d6efd", // Blue
    "South America": "#198754", // Green
    "Europe":        "#dc3545", // Red
    "Africa":        "#fd7e14", // Orange
    "Asia":          "#6f42c1"  // Purple
  };

  // Wait for the DOM to load before initializing map
  document.addEventListener("DOMContentLoaded", () => {
    
    // 3. INITIALIZE LEAFLET MAP
    // Center it globally so most markers are visible on load
    const map = L.map('travel-map').setView([20, 0], 1);

    // 4. ADD TILE LAYER (The underlying map design)
    // Using OpenStreetMap Standard layout
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 5. RENDER THE POINTS ON THE MAP
    poiData.forEach(poi => {
      const pinColor = continentColors[poi.continent] || "#333333";

      // Create a colored circle marker
      const marker = L.circleMarker(poi.coords, {
        radius: 6,           // Size of the circle
        fillColor: pinColor, // Inner color
        color: "#ffffff",    // Border color (white for contrast)
        weight: 1.5,         // Border thickness
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map);

      // Create Popup Content
      const popupContent = `
        <div style="font-family: sans-serif; text-align: center;">
          <strong style="font-size: 1.1em;">${poi.name}</strong><br>
          <span style="color: #666;">${poi.country}</span><br>
          <span style="font-size: 0.9em; background: #eee; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px;">
            Visited: ${poi.year}
          </span>
        </div>
      `;
      marker.bindPopup(popupContent);
    });

    // 6. GENERATE THE LEGEND DYNAMICALLY
    const legendContainer = document.getElementById("map-legend");
    for (const [continent, color] of Object.entries(continentColors)) {
      legendContainer.innerHTML += `
        <div class="legend-item">
          <div class="legend-color" style="background-color: ${color};"></div>
          <span>${continent}</span>
        </div>
      `;
    }
  });
</script>
