let currentFilter = "All";

function renderTimeline() {
    const container = document.getElementById("timeline-container");
    container.innerHTML = "";
    
    const filteredTrips = tripData.filter(trip => currentFilter === "All" || trip.type === currentFilter);
    
    const tripsByYear = {};
    filteredTrips.forEach(trip => {
        if (!tripsByYear[trip.year]) tripsByYear[trip.year] = [];
        tripsByYear[trip.year].push(trip);
    });
    
    // Sort years from most recent to oldest (e.g., 2026 down to 2014)
    const sortedYears = Object.keys(tripsByYear).sort((a, b) => b - a);
    
    sortedYears.forEach(year => {
        const yearSection = document.createElement("div");
        yearSection.className = "timeline-year";
        yearSection.innerHTML = "<h2>" + year + "</h2>";
        
        // Sort trips within the year from most recent to oldest ("Mar 19, 2025" format)
        const sortedTripsForYear = tripsByYear[year].sort((a, b) => {
            // Remove the comma so JS engine parses it reliably
            const dateA = new Date(a.startDate.replace(",", ""));
            const dateB = new Date(b.startDate.replace(",", ""));
            return dateB - dateA;
        });
        
        sortedTripsForYear.forEach(trip => {
            const card = document.createElement("div");
            card.className = "trip-card";
            
            let headerText = trip.type === "International" 
                ? trip.country + " - " + trip.cities 
                : trip.cities;
                
            let html = "<span class='trip-badge badge-" + trip.type + "'>" + trip.type + "</span>";
            html += "<div class='trip-header'>" + headerText + "</div>";
            html += "<div class='trip-details'>📅 " + trip.startDate + " to " + trip.endDate + " | 👥 " + trip.companions + "</div>";
            
            // Conditional Rendering: Blog drawer button if link exists, otherwise show summary paragraph
            if (trip.blogLink && trip.blogLink.trim() !== "") {
                const uniqueId = "blog-drawer-" + Math.random().toString(36).substr(2, 9);
                html += "<button class='blog-btn' onclick='toggleBlog(\"" + uniqueId + "\")'>📝 Toggle Blog Post</button>";
                html += "<div id='" + uniqueId + "' class='blog-frame-container'><iframe class='blog-iframe' src='" + trip.blogLink + "'></iframe></div>";
            } else if (trip.tripSummary && trip.tripSummary.trim() !== "") {
                html += "<div class='trip-summary'>" + trip.tripSummary + "</div>";
            }
            
            card.innerHTML = html;
            yearSection.appendChild(card);
        });
        
        container.appendChild(yearSection);
    });
}

function toggleBlog(id) {
    const drawer = document.getElementById(id);
    drawer.style.display = drawer.style.display === "block" ? "none" : "block";
}

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        currentFilter = this.getAttribute("data-filter");
        document.querySelectorAll(".filter-btn").forEach(b => b.className = "filter-btn");
        if (currentFilter === "All") this.classList.add("active-all");
        if (currentFilter === "International") this.classList.add("active-intl");
        if (currentFilter === "Domestic") this.classList.add("active-dom");
        if (currentFilter === "Local") this.classList.add("active-loc");
        renderTimeline();
    });
});

renderTimeline();
</script>
